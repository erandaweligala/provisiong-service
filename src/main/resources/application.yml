server:
  port: 8089  # HTTPS port 8089 (changed from 8087)
  ssl:
    enabled: false
#    key-store: classpath:aaacsg-server.p12
#    key-store-password: Pass@456Bjd  # Replace with actual password
#    key-store-type: PKCS12
#    key-alias: aaacsg-server  # May need to verify this
  compression:
    enabled: true
    mime-types: application/json,application/xml,text/plain
    min-response-size: 1024
  tomcat:
    max-threads: 200
    min-spare-threads: 20
    accept-count: 100
    connection-timeout: 5000

base-url:
  context: /axonect/aee/templates/v1.0/base-template
app:
  host: /MICROSERVICE_NAME/
  default:
    group-id: 1

  encryption:
    algorithm: AES
    secret-key: "Your16CharKey123"
  async:
    core-pool-size: 50
    max-pool-size: 200
    queue-capacity: 10000
    thread-name-prefix: "async-validation-"

  jwt:
    secret: bXlTdXBlclNlY3JldEtleUZvckpXVEF1dGhlbnRpY2F0aW9uMjAyNA==  # Base64 encoded, min 32 chars
    expiration-ms: 3600000

  kafka:
    topic:
      notification: dc-provisioning
      db-write: dc-provisioning


    publish:
      timeout-ms: 5000
      retry:
        enabled: true
        max-attempts: 2      #need to change in OCP
      require-both-ack: false

    verification: #need to change in OCP
      enabled: true
      max-attempts: 10
      delay-ms: 500
      timeout-ms: 5000
      fail-on-timeout: true

    message:
      expiration-ms: 10000

log:
  identifierKey: UUID
  isDebug: true
info:
  app:
    name :  base-template
    msName : base-template

com:
  adl:
    dte:
      plugins:
        logging:
          enabled: false
          level: DEBUG
        rolling:
          policy: size
          size: 100000kb
        alarming:
          enabled: true
        msstat:
          enabled: true

springdoc:
  packagesToScan: com.axonect.aee.template.baseapp.application.controller
  pathsToMatch: /**
  swagger-ui:
    configUrl: /MICROSERVICE_NAME/v3/api-docs/swagger-config
    url: /MICROSERVICE_NAME/v3/api-docs
    disable-swagger-default-url: true
  api-docs:
    path: /v3/api-docs
spring:
  datasource:
    url: jdbc:oracle:thin:@localhost:1521/XEPDB1
    username: myuser
    password: mypassword
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 50
      minimum-idle: 30
      connection-timeout: 10000
      idle-timeout: 3000
      max-lifetime: 180000
      pool-name: AAAHikariPool
      leak-detection-threshold: 60000
      data-source-properties:
        oracle.net.CONNECT_TIMEOUT: 10000
        oracle.jdbc.ReadTimeout: 30000

  kafka:
    bootstrap-servers: localhost:9092

    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
      properties:
        max.in.flight.requests.per.connection: 5
        compression.type: lz4
        batch.size: 32768
        linger.ms: 5
        buffer.memory: 67108864
        delivery.timeout.ms: 5000 #need to change in OCP   # ← was 300000 (5 min), now 5s — total send timeout
        request.timeout.ms: 2000  #need to change in OCP   # ← was 120000 (2 min), now 2s — per-request timeout
        max.block.ms: 2000        #need to change in OCP

    consumer:
      group-id: spring-reply-group-provisioning   # UPDATED from local — was spring-reply-group; UNIQUE to provisioning service
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      auto-offset-reset: earliest   # Re-read unconsumed reply messages after pod restart
      enable-auto-commit: true
      properties:
        fetch.min.bytes: 1
        fetch.max.wait.ms: 500
        session.timeout.ms: 10000
        heartbeat.interval.ms: 3000

  data:
    redis:
      host: localhost
      port: 6379
      client-type: lettuce
      password:   # remove this if your local Redis has no password
      timeout: 120000ms

      lettuce:
        pool:
          max-active: 600
          max-wait: 3000ms
          max-idle: 200
          min-idle: 10
        shutdown-timeout: 240000ms

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.OracleDialect
        jdbc:
          batch_size: 20
          fetch_size: 1000
        order_inserts: true
        order_updates: true
        connection:
          pool_size: 200         # Add this line (matches max-pool-size)

  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

logging:
  level:
    root: INFO
    org.apache.kafka: INFO
    io.smallrye.reactive.messaging.kafka: INFO

  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"
    file: "%d{yyyy-MM-dd HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n"

  file:
    name: /var/log/dte/${HOSTNAME:unknown}.log
    max-size: 100MB
    max-history: 10

  logback:
    rollingpolicy:
      max-file-size: 100MB
      max-history: 10
      clean-history-on-start: true

kafka:  #need to change in OCP
  reply:
    topic: db-write-events-reply-provisioning     # UPDATED from local — was db-write-events-reply; UNIQUE to provisioning service

# Cache API Configuration
cache:
  api:
    base-url: http://airtel-aaa-accounting-management-service-service.airtel-aaa.svc.cluster.local:9905/api/v1/cache/addBucketList/{bucketUsername}
    connect-timeout: 5000         # Connection timeout in milliseconds
    read-timeout: 10              # Read timeout in seconds
    write-timeout: 10             # Write timeout in seconds
    response-timeout: 10          # Response timeout in seconds
    max-connections: 100          # Maximum connections in pool
    pending-acquire-timeout: 45   # Timeout for acquiring connection from pool (seconds)

    # Retry Configuration
    retry:
      max-attempts: 3             # Maximum retry attempts
      initial-backoff: 2          # Initial backoff in seconds
      max-backoff: 10             # Maximum backoff in seconds

    # Request Timeout
    timeout:
      request: 10                 # Individual request timeout in seconds

accounting:
  service:
    # Base URL for the Quarkus accounting service (Kubernetes service DNS)
    url: http://airtel-aaa-accounting-management-service-service.airtel-aaa.svc.cluster.local:9905/api/v1/cache/

    # Enable/disable CoA requests (set to false during maintenance or testing)
    enabled: true

    # Timeout Configuration
    connect-timeout: 5000         # Connection timeout in milliseconds (5 seconds)
    read-timeout: 10000           # Read timeout in milliseconds (10 seconds)

    # Retry Configuration for CoA requests
    retry:
      enabled: true               # Enable retry logic for failed CoA requests
      max-attempts: 3             # Maximum retry attempts
      initial-backoff: 1000       # Initial backoff in milliseconds (1 second)
      max-backoff: 5000           # Maximum backoff in milliseconds (5 seconds)

thread:
  count:
    dbapiexecutor: 50

management:
  endpoints:
    web:
      base-path: /actuator
      exposure:
        include: "*"
  endpoint:
    prometheus:
      enabled: true
  prometheus:
    metrics:
      export:
        enabled: true
  metrics:
    distribution:
      # Publishes http_server_requests_seconds_bucket, so a response time
      # percentile per endpoint can be read off the histogram. These are plain
      # histogram buckets, not per-endpoint budgets: nothing alerts on them and no
      # endpoint has a target of its own. No dashboard or rule in monitoring/
      # reads them today - they are here for ad hoc queries in Prometheus. Keep
      # the list short: every bucket is another time series per endpoint.
      slo:
        "[http.server.requests]": 25ms,50ms,100ms,200ms,300ms,500ms,750ms,1s,2s,3s,5s,10s

action-log:
  opco: test-env

ip-ping:
  udp-ports: 3799,1812,1813

radius:
  server:
    base-url: http://airtel-aaa-radius-server-service.csg-aaa-app.cluster.local:8080
# ---------------------------------------------------------------------------
# REST endpoint monitoring catalog (Grafana)
#
# Each entry becomes an `api` tag on http_server_requests, which is what the
# Grafana dashboards in monitoring/grafana group by, and an api_endpoint_info
# series so the endpoint shows up even before its first request.
#
# `uris` must hold the Spring URI templates of the handler - path variable
# names are ignored when matching, but the path structure must be exact, so
# keep this list in step with the controllers. ApiMonitoringCatalogTest fails
# the build if it drifts.
# ---------------------------------------------------------------------------
monitoring:
  api:
    enabled: true
    microservice: airtel-aaa-user-provisioning-service

    endpoints:
      - name: create_user
        title: Create user
        method: POST
        uris:
          - /api/user
        dependencies:
          - database
          - kafka

      - name: update_user
        title: Update User
        method: PATCH
        uris:
          - /api/user/{user_name}
        dependencies:
          - database
          - kafka

      - name: delete_user
        title: Delete user
        method: DELETE
        uris:
          - /api/user/{user_name}
        dependencies:
          - database
          - kafka

      - name: activate_user
        title: Activate user
        method: POST
        uris:
          - /api/services/activate
        dependencies:
          - database
          - kafka
          - redis

      # updateService and deleteService are each mapped to two paths; both are
      # listed so either spelling lands on the same time series.
      - name: update_service
        title: Update service
        method: PATCH
        uris:
          - /api/user/{user_id}/services/{plan_id}/{request_id}
          - /api/user/services/{user_id}/{plan_id}/{request_id}
        dependencies:
          - database
          - kafka
          - redis

      - name: delete_service
        title: Delete service
        method: DELETE
        uris:
          - /api/user/{user_id}/services/{plan_id}/{request_id}
          - /api/user/services/{user_id}/{plan_id}/{request_id}
        dependencies:
          - database
          - kafka
          - redis

      - name: get_user
        title: Get user
        method: GET
        uris:
          - /api/user/{user_name}
        dependencies:
          - database

      - name: get_users
        title: Get users
        method: GET
        uris:
          - /api/user
        dependencies:
          - database

      # The API sheet lists this as /api/v1/service-lines/{id}/status; the path
      # actually served by UserController#getServiceDetails is the one below.
      - name: query_user_information
        title: Query User information
        method: GET
        uris:
          - /api/user/service-lines/status/{serviceLineNumber}
        dependencies:
          - database

    # -----------------------------------------------------------------------
    # Per-endpoint health. A ratio of requests says what share of them failed;
    # health says whether the endpoint is fit to serve at all, which is the
    # question an endpoint with no traffic cannot otherwise answer. Three
    # checks decide it - the handler is mapped here, every dependency below is
    # reachable, and the 5xx ratio is under the thresholds. Published as
    # api_endpoint_health and served as JSON on GET /monitoring/endpoints.
    # See monitoring/HEALTH.md.
    # -----------------------------------------------------------------------
    health:
      enabled: true
      evaluation-interval-ms: 15000   # how often the verdict is recomputed
      window-ms: 300000               # how far back the error ratio looks (matches the [5m] rates)
      degraded-error-ratio: 0.01      # 1% of requests failing -> DEGRADED
      unhealthy-error-ratio: 0.10     # 10% -> UNHEALTHY
      minimum-requests: 20            # below this, a failure reads DEGRADED rather than a ratio
      use-dependency-state: true      # a required dependency being DOWN marks the endpoint UNHEALTHY
      verify-mappings: true           # check at startup that every catalogued endpoint has a handler

# ---------------------------------------------------------------------------
# Dependency connectivity monitoring (Oracle / Redis / Kafka)
#
# Publishes dependency_up and the dependency_* failure counters that the Grafana
# dashboard in monitoring/grafana reads, and serves the same state as JSON on
# GET /monitoring/connectivity. Same property names, same defaults and the same
# metric names as the DB write service - `service-name` is what keeps the two
# services' series apart in a shared Prometheus. See monitoring/CONNECTIVITY.md.
# ---------------------------------------------------------------------------
connectivity:
  service-name: airtel-aaa-user-provisioning-service
  enabled: true               # false stops the probes; live traffic failures still count
  failure-threshold: 3        # consecutive connectivity failures before a dependency is marked DOWN
  probe-interval-ms: 15000    # gap between probe rounds
  probe-timeout-ms: 2000      # per-probe budget; a slower answer counts as a failure
  probe-database: true        # SELECT 1 FROM DUAL through the Hikari pool
  probe-redis: true           # PING
  probe-kafka: true           # AdminClient describeCluster
