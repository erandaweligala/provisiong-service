# Prometheus / Thanos alerting rules for the REST endpoints published by
# airtel-aaa-user-provisioning-service.
#
# Apply as a PrometheusRule on OpenShift:
#     oc -n airtel-aaa apply -f user-provisioning-endpoint-rules.yaml
#
# On a plain Prometheus, copy the `spec:` block into a rule_files entry instead.
#
# Every rule is scoped by the `microservice` label that ApiMonitoringConfig adds
# to all meters, so these rules stay put even on a Prometheus shared with the
# rest of the AAA stack.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: airtel-aaa-user-provisioning-endpoints
  namespace: airtel-aaa
  labels:
    app: airtel-aaa-user-provisioning-service
    role: alert-rules
spec:
  groups:
    - name: user-provisioning-endpoint-recording
      interval: 30s
      rules:
        # Availability = share of responses that were not 5xx. 4xx stays
        # "available" on purpose: rejecting a malformed request is the endpoint
        # working, not failing.
        - record: api:availability_ratio:rate5m
          expr: |
            (
              sum by (microservice, api) (
                rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other", status!~"5.."}[5m])
              )
              or
              sum by (microservice, api) (
                rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
              ) * 0
            )
            /
            sum by (microservice, api) (
              rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
            )

        # Share of requests that answered inside the endpoint's own response
        # time budget.
        - record: api:within_threshold_ratio:rate5m
          expr: |
            1 - (
              (
                sum by (microservice, api) (
                  rate(api_requests_over_threshold_total{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
                )
                or
                sum by (microservice, api) (
                  rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
                ) * 0
              )
              /
              sum by (microservice, api) (
                rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
              )
            )

        - record: api:latency_seconds:p95_rate5m
          expr: |
            histogram_quantile(
              0.95,
              sum by (microservice, api, le) (
                rate(http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
              )
            )

    - name: user-provisioning-endpoint-alerts
      rules:
        - alert: UserProvisioningNoMetrics
          expr: |
            absent(api_endpoint_threshold_milliseconds{microservice="airtel-aaa-user-provisioning-service"})
          for: 5m
          labels:
            severity: critical
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: No endpoint metrics from the user provisioning service
            description: >-
              Nothing is publishing api_endpoint_threshold_milliseconds. Either every pod is down or
              the scrape is broken - check the ServiceMonitor and curl /actuator/prometheus on a pod.
              While this fires, none of the other endpoint alerts can fire, so treat it as an outage.

        - alert: UserProvisioningEndpointErrorRateHigh
          expr: api:availability_ratio:rate5m < 0.99
          for: 5m
          labels:
            severity: warning
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} availability is {{ $value | humanizePercentage }}'
            description: >-
              More than 1% of requests to {{ $labels.api }} answered 5xx over the last 5 minutes.

        - alert: UserProvisioningEndpointErrorRateCritical
          expr: api:availability_ratio:rate5m < 0.95
          for: 2m
          labels:
            severity: critical
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} availability is {{ $value | humanizePercentage }}'
            description: >-
              More than 5% of requests to {{ $labels.api }} answered 5xx over the last 5 minutes.

        # Compares each endpoint's p95 against the threshold it publishes, so the
        # numbers here follow application.yml and never drift from it.
        - alert: UserProvisioningEndpointP95OverThreshold
          expr: |
            api:latency_seconds:p95_rate5m
              > on (microservice, api)
            (max by (microservice, api) (api_endpoint_threshold_milliseconds{microservice="airtel-aaa-user-provisioning-service"}) / 1000)
          for: 10m
          labels:
            severity: warning
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} p95 is {{ $value | humanizeDuration }}, over its threshold'
            description: >-
              The 95th percentile response time of {{ $labels.api }} has been above its configured
              response time threshold for 10 minutes.

        - alert: UserProvisioningEndpointBreachingThresholdOften
          expr: api:within_threshold_ratio:rate5m < 0.95
          for: 10m
          labels:
            severity: warning
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} met its response time budget only {{ $value | humanizePercentage }} of the time'
            description: >-
              More than 5% of requests to {{ $labels.api }} took longer than the endpoint's configured
              response time threshold.

        # Only fires where monitoring.api.probe.enabled is true; without the
        # probe the series does not exist and the alert stays silent.
        - alert: UserProvisioningEndpointProbeDown
          expr: max by (microservice, api) (api_endpoint_up{microservice="airtel-aaa-user-provisioning-service"}) == 0
          for: 3m
          labels:
            severity: critical
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: 'Synthetic probe of {{ $labels.api }} is failing on every pod'
            description: >-
              No instance has had a successful synthetic probe of {{ $labels.api }} for 3 minutes.
              Unlike the error rate alerts this one does not need live traffic, so it fires during
              quiet hours too.
