# Prometheus / Thanos alerting rules for REST endpoint availability of
# airtel-aaa-user-provisioning-service.
#
# Apply as a PrometheusRule on OpenShift:
#     oc -n airtel-aaa apply -f user-provisioning-endpoint-rules.yaml
#
# On a plain Prometheus, copy the `spec:` block into a rule_files entry instead.
#
# Every rule is scoped by the `microservice` label that ApiMonitoringConfig adds
# to all meters, so these rules stay put even on a Prometheus shared with the
# rest of the AAA stack.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: airtel-aaa-user-provisioning-endpoints
  namespace: airtel-aaa
  labels:
    app: airtel-aaa-user-provisioning-service
    role: alert-rules
spec:
  groups:
    - name: user-provisioning-endpoint-recording
      interval: 30s
      rules:
        # Availability = share of responses that were not 5xx. 4xx stays
        # "available" on purpose: rejecting a malformed request is the endpoint
        # working, not failing.
        - record: api:availability_ratio:rate5m
          expr: |
            (
              sum by (microservice, api) (
                rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other", status!~"5.."}[5m])
              )
              or
              sum by (microservice, api) (
                rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
              ) * 0
            )
            /
            sum by (microservice, api) (
              rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
            )

    - name: user-provisioning-endpoint-alerts
      rules:
        - alert: UserProvisioningNoMetrics
          expr: |
            absent(api_endpoint_info{microservice="airtel-aaa-user-provisioning-service"})
          for: 5m
          labels:
            severity: critical
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: No endpoint metrics from the user provisioning service
            description: >-
              Nothing is publishing api_endpoint_info. Either every pod is down or the scrape is
              broken - check the ServiceMonitor and curl /actuator/prometheus on a pod.
              While this fires, none of the other endpoint alerts can fire, so treat it as an outage.

        - alert: UserProvisioningEndpointErrorRateHigh
          expr: api:availability_ratio:rate5m < 0.99
          for: 5m
          labels:
            severity: warning
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} availability is {{ $value | humanizePercentage }}'
            description: >-
              More than 1% of requests to {{ $labels.api }} answered 5xx over the last 5 minutes.

        - alert: UserProvisioningEndpointErrorRateCritical
          expr: api:availability_ratio:rate5m < 0.95
          for: 2m
          labels:
            severity: critical
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} availability is {{ $value | humanizePercentage }}'
            description: >-
              More than 5% of requests to {{ $labels.api }} answered 5xx over the last 5 minutes.
