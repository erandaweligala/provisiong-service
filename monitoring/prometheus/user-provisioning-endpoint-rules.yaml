# Prometheus / Thanos rules for REST endpoint availability of
# airtel-aaa-user-provisioning-service.
#
# Apply as a PrometheusRule on OpenShift:
#     oc -n airtel-aaa apply -f user-provisioning-endpoint-rules.yaml
#
# On a plain Prometheus, copy the `spec:` block into a rule_files entry instead.
#
# Every rule is scoped by the `microservice` label that ApiMonitoringConfig adds
# to all meters, so these rules stay put even on a Prometheus shared with the
# rest of the AAA stack.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: airtel-aaa-user-provisioning-endpoints
  namespace: airtel-aaa
  labels:
    app: airtel-aaa-user-provisioning-service
    role: alert-rules
spec:
  groups:
    - name: user-provisioning-endpoint-recording
      interval: 30s
      rules:
        # Availability of one endpoint, 0..1: the share of responses that were
        # not 5xx. 4xx counts as available on purpose - rejecting a malformed
        # request is the endpoint working, not failing.
        #
        # Read it in three parts:
        #
        #   1. the 5xx rate. `or <total> * 0` supplies a zero when there were no
        #      5xx at all, because a selector that matches nothing in Prometheus
        #      returns no series rather than 0, which would otherwise leave a
        #      perfectly healthy endpoint with no availability figure;
        #   2. divided by the total request rate, subtracted from 1;
        #   3. `or api_endpoint_info` catches the endpoints that took no traffic
        #      in the window. Those have no request series at all, so parts 1
        #      and 2 are empty and the constant 1 published per catalogued
        #      endpoint stands in: nothing was called, so nothing failed.
        #      This is what keeps every endpoint on the dashboard instead of
        #      only the ones that happen to be busy.
        - record: api:availability_ratio:rate5m
          expr: |
            (
              1
              -
              (
                sum by (microservice, api) (
                  rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other", status=~"5.."}[5m])
                )
                or
                sum by (microservice, api) (
                  rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
                ) * 0
              )
              /
              sum by (microservice, api) (
                rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
              )
            )
            or
            max by (microservice, api) (
              api_endpoint_info{microservice="airtel-aaa-user-provisioning-service"}
            )

        # Response time per endpoint. Unlike availability these have no idle
        # fallback on purpose: an endpoint nobody called has no response time,
        # and the honest answer is no data rather than a made up zero.
        #
        # The average is exact - it is the timer's own total time over its own
        # request count. The percentiles are estimates read off the histogram
        # buckets configured by management.metrics.distribution.slo in
        # application.yml, so they are only as precise as those bucket edges.
        - record: api:latency_seconds:avg_rate5m
          expr: |
            sum by (microservice, api) (
              rate(http_server_requests_seconds_sum{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
            )
            /
            sum by (microservice, api) (
              rate(http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
            )

        - record: api:latency_seconds:p95_rate5m
          expr: |
            histogram_quantile(
              0.95,
              sum by (microservice, api, le) (
                rate(http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
              )
            )

        - record: api:latency_seconds:p99_rate5m
          expr: |
            histogram_quantile(
              0.99,
              sum by (microservice, api, le) (
                rate(http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api!="other"}[5m])
              )
            )

    - name: user-provisioning-endpoint-alerts
      rules:
        # api_endpoint_info exists for every catalogued endpoint from startup, so
        # its absence means no pod is being scraped at all.
        - alert: UserProvisioningNoMetrics
          expr: |
            absent(api_endpoint_info{microservice="airtel-aaa-user-provisioning-service"})
          for: 5m
          labels:
            severity: critical
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: No endpoint metrics from the user provisioning service
            description: >-
              Nothing is publishing api_endpoint_info. Either every pod is down or the scrape is
              broken - check the ServiceMonitor and curl /actuator/prometheus on a pod.
              While this fires none of the other endpoint alerts can fire, so treat it as an outage.

        - alert: UserProvisioningEndpointAvailabilityLow
          expr: api:availability_ratio:rate5m < 0.99
          for: 5m
          labels:
            severity: warning
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} availability is {{ $value | humanizePercentage }}'
            description: >-
              More than 1% of requests to {{ $labels.api }} answered 5xx over the last 5 minutes.

        - alert: UserProvisioningEndpointAvailabilityCritical
          expr: api:availability_ratio:rate5m < 0.95
          for: 2m
          labels:
            severity: critical
            service: airtel-aaa-user-provisioning-service
          annotations:
            summary: '{{ $labels.api }} availability is {{ $value | humanizePercentage }}'
            description: >-
              More than 5% of requests to {{ $labels.api }} answered 5xx over the last 5 minutes.
