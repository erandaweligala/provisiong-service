# promtool unit test for the availability and response time recording rules,
# and for the availability alerts.
#
# It pins down the cases that matter, in particular the two availability cases
# that used to come back empty instead of a number:
#
#   create_user    traffic, and not one 5xx series in Prometheus -> 100%
#   get_user       6 of every 60 requests answer 5xx             ->  90%
#   delete_user    every request answers 5xx                     ->   0%
#   idle_endpoint  no request series at all                      -> 100%
#
# and, for response time, that the average is exact, that the percentiles read
# the histogram buckets correctly, and that an idle endpoint reports no latency
# at all rather than borrowing the availability fallback.
#
# Response times are asserted in whole milliseconds - `round(rule * 1000)` -
# because rate() arithmetic lands a few ulps off a round decimal and promtool
# compares floats exactly.
#
# The rules ship as a PrometheusRule custom resource, which promtool cannot read
# directly, so extract the spec first:
#
#   python3 -c "import yaml; \
#     yaml.safe_dump(yaml.safe_load(open('user-provisioning-endpoint-rules.yaml'))['spec'], \
#                    open('rules.yaml','w'), sort_keys=False)"
#   promtool test rules user-provisioning-endpoint-rules_test.yaml
#   rm rules.yaml
rule_files:
  - rules.yaml

evaluation_interval: 1m

tests:
  - interval: 1m
    input_series:
      # The catalog: published from startup regardless of traffic.
      - series: 'api_endpoint_info{microservice="airtel-aaa-user-provisioning-service", api="create_user", method="POST", title="Create user"}'
        values: '1+0x15'
      - series: 'api_endpoint_info{microservice="airtel-aaa-user-provisioning-service", api="get_user", method="GET", title="Get user"}'
        values: '1+0x15'
      - series: 'api_endpoint_info{microservice="airtel-aaa-user-provisioning-service", api="delete_user", method="DELETE", title="Delete user"}'
        values: '1+0x15'
      - series: 'api_endpoint_info{microservice="airtel-aaa-user-provisioning-service", api="idle_endpoint", method="GET", title="Idle"}'
        values: '1+0x15'

      # --- availability fixture ---------------------------------------------
      # create_user: healthy, 60 req/min all 200 - and NOT A SINGLE 5xx series.
      - series: 'http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api="create_user", status="200"}'
        values: '0+60x15'

      # get_user: 60 req/min, 6 of them 5xx -> 90% available.
      - series: 'http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api="get_user", status="200"}'
        values: '0+54x15'
      - series: 'http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api="get_user", status="500"}'
        values: '0+6x15'

      # delete_user: totally broken, every response 5xx -> 0% available.
      - series: 'http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api="delete_user", status="503"}'
        values: '0+60x15'

      # idle_endpoint: no request series at all.

      # --- response time fixture --------------------------------------------
      # fast_endpoint answers every request inside the first bucket.
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="0.025"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="0.05"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="0.1"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="0.2"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="0.3"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="0.5"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="0.75"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="1.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="2.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="3.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="5.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="10.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint", le="+Inf"}'
        values: '0+60x15'
      # slow_endpoint puts 3 of every 60 into the 2s-3s bucket. p95 therefore
      # still reads 200ms and only p99 exposes the tail.
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="0.025"}'
        values: '0+0x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="0.05"}'
        values: '0+0x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="0.1"}'
        values: '0+0x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="0.2"}'
        values: '0+57x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="0.3"}'
        values: '0+57x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="0.5"}'
        values: '0+57x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="0.75"}'
        values: '0+57x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="1.0"}'
        values: '0+57x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="2.0"}'
        values: '0+57x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="3.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="5.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="10.0"}'
        values: '0+60x15'
      - series: 'http_server_requests_seconds_bucket{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint", le="+Inf"}'
        values: '0+60x15'
      # 60 requests/min totalling 1.2s -> a 20ms average.
      - series: 'http_server_requests_seconds_sum{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint"}'
        values: '0+1.2x15'
      - series: 'http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint"}'
        values: '0+60x15'
      # 60 requests/min totalling 18s -> a 300ms average.
      - series: 'http_server_requests_seconds_sum{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint"}'
        values: '0+18x15'
      - series: 'http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint"}'
        values: '0+60x15'

      # Uncatalogued traffic must never reach the figures.
      - series: 'http_server_requests_seconds_count{microservice="airtel-aaa-user-provisioning-service", api="other", status="500"}'
        values: '0+600x15'

    promql_expr_test:
      - expr: api:availability_ratio:rate5m
        eval_time: 10m
        exp_samples:
          - labels: '{__name__="api:availability_ratio:rate5m", microservice="airtel-aaa-user-provisioning-service", api="create_user"}'
            value: 1
          - labels: '{__name__="api:availability_ratio:rate5m", microservice="airtel-aaa-user-provisioning-service", api="get_user"}'
            value: 0.9
          - labels: '{__name__="api:availability_ratio:rate5m", microservice="airtel-aaa-user-provisioning-service", api="delete_user"}'
            value: 0
          - labels: '{__name__="api:availability_ratio:rate5m", microservice="airtel-aaa-user-provisioning-service", api="idle_endpoint"}'
            value: 1
          - labels: '{__name__="api:availability_ratio:rate5m", microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint"}'
            value: 1
          - labels: '{__name__="api:availability_ratio:rate5m", microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint"}'
            value: 1

      # The same figure as a plain yes/no, which is what the Available column of
      # the dashboard table shows: 1 (Yes) at or above 99%, 0 (No) below it -
      # the threshold UserProvisioningEndpointAvailabilityLow alerts on. get_user
      # at 90% is the case that separates the two, and an idle endpoint answers
      # Yes for the same reason it reads 100%: nothing was called, so nothing
      # failed.
      - expr: api:availability_ratio:rate5m >= bool 0.99
        eval_time: 10m
        exp_samples:
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="create_user"}'
            value: 1
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="get_user"}'
            value: 0
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="delete_user"}'
            value: 0
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="idle_endpoint"}'
            value: 1
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint"}'
            value: 1
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint"}'
            value: 1

      # Exact: the timer's own total time over its own request count.
      - expr: round(api:latency_seconds:avg_rate5m * 1000)
        eval_time: 10m
        exp_samples:
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint"}'
            value: 20
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint"}'
            value: 300

      # Estimated from the buckets. fast_endpoint has everything in the first
      # bucket, so p95 interpolates inside 0..25ms. slow_endpoint's 3 slow calls
      # per minute are exactly 5% of its traffic, so its p95 sits on the 200ms
      # bucket edge and says nothing about them.
      - expr: round(api:latency_seconds:p95_rate5m * 1000)
        eval_time: 10m
        exp_samples:
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint"}'
            value: 24
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint"}'
            value: 200

      # p99 is where slow_endpoint's tail shows up: rank 59.4 of 60 falls in the
      # 2s-3s bucket and interpolates to 2.8s.
      - expr: round(api:latency_seconds:p99_rate5m * 1000)
        eval_time: 10m
        exp_samples:
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="fast_endpoint"}'
            value: 25
          - labels: '{microservice="airtel-aaa-user-provisioning-service", api="slow_endpoint"}'
            value: 2800

      # No traffic means no response time - the availability fallback must not
      # leak into the latency rules.
      - expr: 'api:latency_seconds:p95_rate5m{api="idle_endpoint"}'
        eval_time: 10m
        exp_samples: []
      - expr: 'api:latency_seconds:avg_rate5m{api="idle_endpoint"}'
        eval_time: 10m
        exp_samples: []

    alert_rule_test:
      - eval_time: 10m
        alertname: UserProvisioningEndpointAvailabilityCritical
        exp_alerts:
          - exp_labels:
              severity: critical
              service: airtel-aaa-user-provisioning-service
              api: get_user
              microservice: airtel-aaa-user-provisioning-service
            exp_annotations:
              summary: 'get_user availability is 90%'
              description: 'More than 5% of requests to get_user answered 5xx over the last 5 minutes.'
          - exp_labels:
              severity: critical
              service: airtel-aaa-user-provisioning-service
              api: delete_user
              microservice: airtel-aaa-user-provisioning-service
            exp_annotations:
              summary: 'delete_user availability is 0%'
              description: 'More than 5% of requests to delete_user answered 5xx over the last 5 minutes.'

      - eval_time: 10m
        alertname: UserProvisioningNoMetrics
        exp_alerts: []
